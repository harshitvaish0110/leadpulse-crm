# LeadPulse CI — lint, test and build all three services.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: leadpulse_test
          POSTGRES_USER: leadpulse
          POSTGRES_PASSWORD: leadpulse_secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadpulse -d leadpulse_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://leadpulse:leadpulse_secret@localhost:5432/leadpulse_test?schema=public
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      NODE_ENV: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Migration guard (no drops of hand-managed DB objects)
        run: |
          if grep -RInE 'DROP INDEX[^;]*(embeddings_vector_hnsw|embeddings_tsv_gin|contacts_tags_gin)|DROP (TRIGGER|VIEW)[^;]*(audit_logs_append_only|ml_contact_features|ml_deal_features)' prisma/migrations; then
            echo "::error::A migration drops a hand-managed index/trigger/view; remove the DROP from the migration"
            exit 1
          fi
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm test
      - name: Seed and run schema guard tests
        run: npm run seed && npm run test:integration

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements*.txt
      # CPU-only torch wheel (avoids the multi-GB CUDA build)
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
